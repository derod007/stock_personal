name: History data preparation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l bin/paper/HistoryResearch.php
          php -l bin/paper_history_prepare.php
          php tests/history_research.php
