name: Fixed universe pattern replay checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l bin/paper/PatternReplay.php
          php -l bin/paper_pattern_replay.php
          php -l bin/paper/PullbackCompare.php
          php -l docs/research/prior-period-compare.php
          php tests/pattern_replay.php
          php tests/pullback_compare.php
          php -l bin/paper/BreakevenResearch.php
          php -l bin/paper_breakeven_research.php
          php tests/breakeven_research.php
