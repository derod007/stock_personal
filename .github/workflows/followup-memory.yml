name: Followup memory regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l bin/paper_followup.php
          php -l bin/paper/Followup.php
          php -d memory_limit=512M tests/followup_memory.php
