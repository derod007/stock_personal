name: Historical research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l bin/paper/HistoricalResearch.php
          php -l bin/paper_historical_research.php
          php tests/historical_research.php
