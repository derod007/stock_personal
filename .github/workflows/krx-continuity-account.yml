name: KRX continuity account study
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l bin/paper/KrxAccountStudy.php
          php -l bin/paper/KrxAccountReplay.php
          php -l bin/paper_krx_account_study.php
          php tests/krx_account_study.php
          php tests/krx_continuity_review.php
          php tests/dated_top100_replay.php
