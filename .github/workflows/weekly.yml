name: Weekly paper report checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  weekly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: php -l bin/paper/Weekly.php && php -l bin/paper_weekly.php && php -l paper_weekly.php
      - run: php tests/weekly.php
