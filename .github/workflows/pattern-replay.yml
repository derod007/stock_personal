name: Fixed universe pattern replay checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l bin/paper/PatternReplay.php
          php -l bin/paper_pattern_replay.php
          php -l bin/paper/ReviewCharts.php
          php -l bin/paper/ReviewPack.php
          php -l bin/paper_review_pack.php
          php tests/review_pack.php
          php -l bin/paper/PullbackSegmentPilot.php
          php -l bin/paper_pullback_segment_pilot.php
          php tests/pullback_segment_pilot.php
          php -l bin/paper/PullbackCompare.php
          php -l docs/research/prior-period-compare.php
          php tests/pattern_replay.php
          php tests/pullback_compare.php
          php -l bin/paper/BreakevenResearch.php
          php -l bin/paper_breakeven_research.php
          php tests/breakeven_research.php
          php -l bin/paper/RedeclineStop.php
          php -l bin/paper/RedeclineStudy.php
          php -l bin/paper_recent_redecline_stop.php
          php tests/redecline_stop.php
          php -l bin/paper/AccountReplay.php
          php -l bin/paper_account_replay.php
          php tests/account_replay.php
          php tests/sector_freeze.php
          php tests/selection_correspondence.php
          php -l bin/paper/DatedTop100Replay.php
          php -l bin/paper_dated_top100_replay.php
          php tests/dated_top100_replay.php
          php tests/dated_order_audit.php
          php -l bin/paper/OpportunityResearch.php
          php -l bin/paper_opportunity_research.php
          php tests/opportunity_research.php
          php bin/paper_opportunity_research.php inventory > /dev/null
          php -l bin/paper/DatedTop100Prep.php
          php -l bin/paper_dated_top100_prep.php
          php tests/dated_top100_prep.php
          python3 -m unittest tests.test_historical_amount_top100_pilot tests.test_dated_amount_top100_range tests.test_dated_amount_top100_provider_review tests.test_dated_amount_top100_replay
