name: Type1 scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and offline regression
        run: |
          php -l index.php
          php -l type1_scan.php
          php -l bin/type1/Classifier.php
          php -l bin/type1/Scanner.php
          php -l bin/type1/Page.php
          php tests/type1_scan.php
          php -l bin/type1/Tracker.php
          php -l bin/type1/Store.php
          php -l bin/type1/Collector.php
          php -l bin/type1/TrackingView.php
          php -l bin/type1_track.php
          php -l type1_tracking.php
          php tests/type1_tracking.php
          python3 -m unittest tests.test_paper_daily tests.test_followup_daily tests.test_target_tracking_daily tests.test_account_rollout
          php -l bin/type1/Charts.php
          php tests/type1_tracking_ui.php
          php -l type1_intraday.php
          php -l bin/type1/Intraday.php
          php tests/type1_intraday.php
          php -l src/Breakout20.php
          php -l bin/paper/Breakout20Panel.php
          php tests/breakout20.php
          php -l src/Type1Breakout.php
          php -l type1_breakout.php
          php tests/type1_breakout.php
          php -l bin/type1/EntryReference.php
          php tests/type1_entry_reference.php
          php tests/type1_breakout_retest.php
