name: Recovery close research account
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l bin/paper_recovery_close_account.php
          php tests/recovery_close_account.php
          php tests/dated_top100_replay.php
          php tests/opportunity_research.php
