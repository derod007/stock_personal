name: KRX no pullback account study
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l bin/paper/NoPullbackStudy.php
          php -l bin/paper/NoPullbackEngine.php
          php -l bin/paper_no_pullback_study.php
          php tests/no_pullback_study.php
          php tests/krx_continuity_review.php
          php tests/dated_top100_replay.php
