name: Manual intraday score checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          php -l bin/paper/EntryJourney.php
          php -l paper_journey.php
          php tests/entry_journey.php
          php -l bin/paper/YahooSessionEvidence.php
          php -l paper_diagnostics.php
          php tests/naver_fallback.php
          php -l bin/paper/DailyChanges.php
          php -l paper_changes.php
          php tests/daily_changes.php
          node tests/scan_sort.cjs
          php -l src/IntradayAnalysis.php
          php -l src/CurrentQuoteClient.php
          php -l src/ProposalService.php
          php -l src/KrAmountScanner.php
          php -l index.php
          php tests/yahoo_missing_close.php
          php tests/midnight_daily.php
          php tests/intraday.php
          php tests/scan_entry_view.php
          php tests/current_quote.php
          php tests/rr_scan.php
