name: PHP signal and replay checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: php --version
      - name: Syntax
        run: |
          find src bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
          php -l paper.php
          php -l paper_diagnostics.php
          php -l paper_trades.php
          php -l paper_rr.php
      - name: Regression
        run: |
          php tests/trend_recovery.php
          php tests/spike_dump.php
          php tests/spike_dump_replay.php
          php tests/v9.php
          php tests/v13.php
          php tests/v14.php
          php tests/tracking_input.php
          php tests/rediagnosis.php
          php tests/target_tracking.php
          php -d memory_limit=512M tests/envelope_research.php
          php -d memory_limit=512M tests/envelope_memory.php
          php tests/target_comparison.php
          php tests/target_research.php
          php tests/stop_research.php
          php tests/condition_research.php
          php tests/single_condition.php
          php tests/rejection_review.php
          php tests/rr_view.php
          php tests/followup.php
          php tests/rr_audit.php
          php tests/rr_scan.php
          php tests/current_quote.php
          php tests/weekly.php
          php tests/amount_exclude.php
      - name: Operational logging tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
  comparison:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public history
        run: python3 bin/fetch_comparison_data.py
      - name: Compare fixed rules on identical history
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path("data/comparison")
          for s in json.loads((root/"sources.json").read_text()):
              if "file" not in s: continue
              p = subprocess.run(["php", "bin/compare_strategies.php", "--file="+s["file"], "--symbol="+s["symbol"]], text=True, capture_output=True)
              if p.returncode: raise RuntimeError(p.stderr + p.stdout)
              result = json.loads(p.stdout)
              (root/(s["symbol"]+"-comparison.json")).write_text(p.stdout)
              print("COMPARISON="+json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-data-and-results
          path: data/comparison/

